<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="535" viewBox="0 0 1480 535" role="img" aria-labelledby="title desc">
<title id="title">Shared nuclear data paths for Python and C++</title><desc id="desc">The locally configured data_root.txt provides one data directory for Python and C++; importing the Python configuration provides variables and running the script generates a C++ header.</desc>
<defs>
  <filter id="soft" x="-12%" y="-100%" width="124%" height="300%"><feGaussianBlur stdDeviation="1.35"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#738ca1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="grayarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#a2acb4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="1480" height="535" rx="0" fill="#f8fafb" stroke="#f8fafb" stroke-width="0" /><text x="64" y="66" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#263849" text-anchor="start" >One data location, shared by Python and C++</text><text x="64" y="106" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#73828b" text-anchor="start" >data_root.txt is local and not committed to Git.</text><rect x="58" y="185" width="324" height="126" rx="15" fill="#eef4f8" stroke="#86a3b8" stroke-width="2.5" /><text x="220" y="236" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#294e67" text-anchor="middle" >data_root.txt</text><text x="220" y="271" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#607a8b" text-anchor="middle" >path to nuclear-data libraries</text><rect x="506" y="160" width="377" height="115" rx="15" fill="#fff" stroke="#c7d4dd" stroke-width="2" /><text x="694" y="203" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="650" fill="#30495e" text-anchor="middle" >openmc_workbench_config.py</text><text x="694" y="235" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#74818b" text-anchor="middle" >imported by Python notebooks</text><rect x="506" y="333" width="377" height="121" rx="15" fill="#fff" stroke="#c7d4dd" stroke-width="2" /><text x="694" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="650" fill="#30495e" text-anchor="middle" >python openmc_workbench_config.py</text><text x="694" y="413" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#74818b" text-anchor="middle" >run to generate the C++ header</text><rect x="1040" y="160" width="373" height="115" rx="15" fill="#f2f5f7" stroke="#cbd5dc" stroke-width="2" /><text x="1226" y="202" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="650" fill="#30495e" text-anchor="middle" >Python variables</text><text x="1226" y="235" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#70808d" text-anchor="middle" >e.g. ENDF_B81</text><rect x="1040" y="333" width="373" height="121" rx="15" fill="#f2f5f7" stroke="#cbd5dc" stroke-width="2" /><text x="1226" y="378" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#30495e" text-anchor="middle" >openmc_workbench_config.hpp</text><text x="1226" y="413" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#70808d" text-anchor="middle" >included by C++ programs</text><path d="M 385 247 C 442 247, 447 218, 498 218" fill="none" stroke="#809bae" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 385 259 C 436 259, 451 390, 498 390" fill="none" stroke="#809bae" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 885 217 L 1034 217" fill="none" stroke="#809bae" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 885 396 L 1034 396" fill="none" stroke="#809bae" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="67" y="492" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#73828b" text-anchor="start" >C++ reads data_root.txt when the program runs; regenerate the header if directories change.</text>
</svg>