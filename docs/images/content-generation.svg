<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="625" viewBox="0 0 1500 625" role="img" aria-labelledby="title desc">
<title id="title">How update_structure.py generates documentation</title><desc id="desc">Input files including notebooks, source code, myst.yml and README pass into update_structure.py, which produces notebook outlines, a README directory tree, and index API tables with shared text.</desc>
<defs>
  <filter id="soft" x="-12%" y="-100%" width="124%" height="300%"><feGaussianBlur stdDeviation="1.35"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#738ca1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="grayarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#a2acb4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="1500" height="625" rx="0" fill="#f8fafb" stroke="#f8fafb" stroke-width="0" /><text x="64" y="66" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#263849" text-anchor="start" >One script, several kinds of output</text><text x="64" y="103" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#72818c" text-anchor="start" >The script reads repository files; it does not execute notebook cells.</text><rect x="64" y="145" width="395" height="88" rx="12" fill="#fff" stroke="#ccd5dc" stroke-width="2" /><text x="83" y="179" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#30495e" text-anchor="start" >Notebook .ipynb</text><text x="83" y="209" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#74818b" text-anchor="start" >Headings + marked description</text><rect x="64" y="250" width="395" height="88" rx="12" fill="#fff" stroke="#ccd5dc" stroke-width="2" /><text x="83" y="284" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#30495e" text-anchor="start" >Numbered .py / .cpp</text><text x="83" y="314" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#74818b" text-anchor="start" >Git-tracked or nonignored files</text><rect x="64" y="355" width="395" height="88" rx="12" fill="#fff" stroke="#ccd5dc" stroke-width="2" /><text x="83" y="389" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#30495e" text-anchor="start" >myst.yml</text><text x="83" y="419" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#74818b" text-anchor="start" >Notebook pages to include</text><rect x="64" y="460" width="395" height="88" rx="12" fill="#fff" stroke="#ccd5dc" stroke-width="2" /><text x="83" y="494" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#30495e" text-anchor="start" >README.md</text><text x="83" y="524" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#74818b" text-anchor="start" >Shared text and sections</text><rect x="568" y="214" width="366" height="280" rx="18" fill="#edf4f8" stroke="#90aabe" stroke-width="2.5" /><text x="751" y="277" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#637e93" text-anchor="middle" >scripts/</text><text x="751" y="315" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#294e67" text-anchor="middle" >update_structure.py</text><text x="751" y="363" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6b8496" text-anchor="middle" >with</text><text x="751" y="399" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#294e67" text-anchor="middle" >openmc_api_index.py</text><text x="751" y="452" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6d8292" text-anchor="middle" >for OpenMC API links</text><rect x="1045" y="145" width="392" height="109" rx="12" fill="#fff" stroke="#ccd5dc" stroke-width="2" /><text x="1068" y="185" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="650" fill="#30495e" text-anchor="start" >Notebook outlines</text><text x="1068" y="222" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#74818b" text-anchor="start" >Headings → generated tree</text><rect x="1045" y="280" width="392" height="109" rx="12" fill="#fff" stroke="#ccd5dc" stroke-width="2" /><text x="1068" y="320" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="650" fill="#30495e" text-anchor="start" >README.md</text><text x="1068" y="357" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#74818b" text-anchor="start" >Exploration directory tree</text><rect x="1045" y="415" width="392" height="109" rx="12" fill="#fff" stroke="#ccd5dc" stroke-width="2" /><text x="1068" y="455" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="650" fill="#30495e" text-anchor="start" >index.md</text><text x="1068" y="492" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#74818b" text-anchor="start" >Grouped API tables + shared text</text><path d="M 460 189 C 501 189, 517 354, 563 354" fill="none" stroke="#9dabb6" stroke-width="2.5" stroke-linecap="round" /><path d="M 460 294 C 501 294, 517 354, 563 354" fill="none" stroke="#9dabb6" stroke-width="2.5" stroke-linecap="round" /><path d="M 460 399 C 501 399, 517 354, 563 354" fill="none" stroke="#9dabb6" stroke-width="2.5" stroke-linecap="round" /><path d="M 460 503 C 501 503, 517 354, 563 354" fill="none" stroke="#9dabb6" stroke-width="2.5" stroke-linecap="round" /><path d="M 938 354 C 984 354, 989 202, 1038 202" fill="none" stroke="#738fa3" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 938 354 C 984 354, 989 337, 1038 337" fill="none" stroke="#738fa3" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 938 354 C 984 354, 989 472, 1038 472" fill="none" stroke="#738fa3" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><text x="750" y="564" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#74818b" text-anchor="middle" >Descriptions for .py / .cpp can be edited in index.md and retained on later runs.</text>
