<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="595" viewBox="0 0 1500 595" role="img" aria-labelledby="title desc">
<title id="title">Local precommit checks and GitHub Actions</title><desc id="desc">A horizontal process from edits through pre-commit to commit and GitHub Actions. Four local checks run, including structure, notebook schema, local links, and Python Ruff. Scientific validation remains outside these checks. A separate weekly workflow checks external links.</desc>
<defs>
  <filter id="soft" x="-12%" y="-100%" width="124%" height="300%"><feGaussianBlur stdDeviation="1.35"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#738ca1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="grayarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#a2acb4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="1500" height="595" rx="0" fill="#f8fafb" stroke="#f8fafb" stroke-width="0" /><text x="64" y="68" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#263849" text-anchor="start" >Checks before and after a commit</text><text x="64" y="106" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#74818b" text-anchor="start" >Local hooks can update generated files; GitHub checks only report whether they are up to date.</text><rect x="61" y="176" width="260" height="139" rx="15" fill="#fff" stroke="#ccd5dc" stroke-width="2" /><text x="77" y="227" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="650" fill="#30495e" text-anchor="start" >Edit files</text><text x="77" y="268" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#73818b" text-anchor="start" >Notebooks, Markdown, code</text><rect x="433" y="176" width="260" height="139" rx="15" fill="#edf4f8" stroke="#89a7bc" stroke-width="2" /><text x="449" y="227" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="650" fill="#30495e" text-anchor="start" >Pre-commit</text><text x="449" y="268" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#73818b" text-anchor="start" >Four local checks</text><rect x="805" y="176" width="260" height="139" rx="15" fill="#fff" stroke="#ccd5dc" stroke-width="2" /><text x="821" y="227" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="650" fill="#30495e" text-anchor="start" >Commit / push</text><text x="821" y="268" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#73818b" text-anchor="start" >Review staged changes</text><rect x="1176" y="176" width="274" height="139" rx="15" fill="#fff" stroke="#ccd5dc" stroke-width="2" /><text x="1192" y="227" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="650" fill="#30495e" text-anchor="start" >GitHub Actions</text><text x="1192" y="268" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#73818b" text-anchor="start" >Validate again</text><path d="M 323 244 L 427 244" fill="none" stroke="#8099ac" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 695 244 L 799 244" fill="none" stroke="#8099ac" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 1067 244 L 1170 244" fill="none" stroke="#8099ac" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="433" y="342" width="260" height="102" rx="12" fill="#edf4f8" stroke="#b8cad7" stroke-width="1.8" /><text x="452" y="371" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#506d80" text-anchor="start" >• Generated content</text><text x="452" y="394" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#506d80" text-anchor="start" >• Notebook schema</text><text x="452" y="417" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#506d80" text-anchor="start" >• Local links + Ruff</text><path d="M 562 320 L 562 338" fill="none" stroke="#9caebc" stroke-width="2.3" stroke-linecap="round" /><rect x="61" y="486" width="1389" height="63" rx="13" fill="#f2f3f4" stroke="#d5dadd" stroke-width="1.8" /><text x="89" y="526" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#667782" text-anchor="start" >Outside these checks: notebook execution, nuclear-data integrity, transport results and physics validation.</text><text x="1194" y="345" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#72818b" text-anchor="start" >Separate weekly workflow:</text><text x="1194" y="375" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#4e6576" text-anchor="start" >external HTTP links</text>
</svg>