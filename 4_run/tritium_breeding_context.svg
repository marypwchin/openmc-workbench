<title id="svgtitle">Tritium breeding in the context of fusion energy</title>
<desc id="svgdesc">Nested overview of fusion fuel reactions, ways tritium is produced, the deuterium–tritium fusion and lithium breeding cycle, and factors affecting blanket performance, with an IAEA presentation link for broader engineering context. The notebook models 14 MeV source-neutron transport through concentric spherical first-wall and PbLi breeder regions, and tallies lithium tritium production and neutron fluence.</desc>
