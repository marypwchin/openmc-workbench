version: 1

project:
  title: OpenMC Workbench
  authors:
    - name: Mary P. W. Chin
  github: https://github.com/marypwchin/openmc-workbench
  toc:
    - file: index.md
    - title: Nuclear data
      file: 0_nuclear_data/README.md
      children:
        - pattern: 0_nuclear_data/*.ipynb
    - title: Cross sections
      children:
        - pattern: 1_cross_sections/*.ipynb
    - title: Materials
      file: 2_materials/README.md
      children:
        - pattern: 2_materials/*.ipynb
    - title: Geometry
      file: 3_geometry/README.md
      children:
        - pattern: 3_geometry/*.ipynb
    - title: Run on a single machine
      file: 4_run/README.md
      children:
        - pattern: 4_run/*.ipynb
    - title: Run in parallel
      file: 5_MPI_HPC_HTC/README.md
    - file: docs/compilers_and_libraries.md
site:
  template: book-theme
  options:
    logo: assets/logo.png
    logo_text: OpenMC Workbench
    logo_alt: OpenMC Workbench
  parts:
    primary_sidebar_footer: sidebar-footer.md
