name: Validate notebooks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt -e .
      - name: Set up test nuclear-data paths
        run: |
          mkdir -p "$RUNNER_TEMP/nuclear_data/endf-b8.1"
          printf '%s\n' "$RUNNER_TEMP/nuclear_data" > data_root.txt
      - name: Check shared configuration outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import openmc_workbench_config as config

          expected_root = Path(os.environ['RUNNER_TEMP']) / 'nuclear_data'
          print('Module:', config.__file__)
          print('Config file:', config.CONFIG_FILE)
          print('Config file exists:', config.CONFIG_FILE.is_file())
          if config.CONFIG_FILE.is_file():
              print('Configured path:', repr(config.CONFIG_FILE.read_text().strip()))
          print('RUNNER_TEMP:', os.environ.get('RUNNER_TEMP'))
          print('Expected test root:', expected_root)
          print('Expected test root exists:', expected_root.is_dir())
          print('DATA_ROOT:', config.DATA_ROOT)
          print('DATA_ROOT exists:', config.DATA_ROOT.is_dir())
          print('Discovered libraries:', sorted(config.LIBRARY_PATHS))

          assert config.DATA_ROOT.is_absolute(), 'DATA_ROOT is not absolute'
          assert config.DATA_ROOT.is_dir(), f'DATA_ROOT does not exist: {config.DATA_ROOT}'
          assert hasattr(config, 'ENDF_B81'), 'ENDF_B81 was not discovered'
          assert config.ENDF_B81 == config.DATA_ROOT / 'endf-b8.1', 'ENDF_B81 path differs'
          assert config.ENDF_B81.is_dir(), f'ENDF_B81 does not exist: {config.ENDF_B81}'

          print('Shared configuration imports outside the repository:', config.ENDF_B81)
          PY
      - name: Check generated structures
        run: python scripts/update_structure.py --check
      - name: Validate notebook schemas
        run: git ls-files -z '*.ipynb' ':!:**/.ipynb_checkpoints/**' | xargs -0 python scripts/check_notebooks.py
      - name: Check local file links
        run: python scripts/check_links.py
      - name: Check Python syntax, fatal errors, and unused imports
        run: ruff check --select E9,F63,F7,F82,F401 .
